  <script src="index.js"></script>

  <script>
    function getDestSuffix(){
        let pathName=window.location.pathname;
        let fileName=pathName.substring(pathName.lastIndexOf('/')+ 1);
        if(fileName=='')fileName='index.html';

        let destSuffix='.html';
        if(fileName.split('_')[1])destSuffix='_'+fileName.split('_')[1];
        return destSuffix
    }

    var destSuffix=getDestSuffix();
    var devMode=(destSuffix!='.html');

   function toHome(){
       document.getElementById("home").href = "https://speierling.arglos.ch/gis/site/index"+destSuffix;
   }
  </script>

  <script>
     function onBody(){

	 toHome();
	 records=[];

	 fetch('sorbusdomestica.geojson')
	 .then((resp) => resp.json())
	     .then(function(data) {
		 let features=data.features;

		 for(const feature of features){
		     let tags=feature.properties.tags
		     let coordinates=feature.geometry.coordinates;
		     let link='https://openstreetmap.org/'+feature.id;
		     tags['openstreetmap']=link;
		     tags['lat']=coordinates[1];
		     tags['lon']=coordinates[0];
		     records.push(tags);
		 }
		 tableMain('tabelle',records,columns);     
	 })
	 .catch(function(error) {
	   console.log(error);
	 });
     }    
  </script>

  
  <style>

    body {

    tbody tr:nth-child(even) {

    }
    
  </style>
</head>

<body onload="onBody()" id="body">

  <div style="margin:auto;background-color:grey" id="tabelle"></div>
</body>
